<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a12">
<title>AVI STUDIO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090a12;color:#f5f3ff;font-family:Inter,Arial,sans-serif}
header{height:72px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #242333}
.logo{font-weight:900;letter-spacing:2px;font-size:21px}
.logo span{color:#a78bfa}
button{border:0;border-radius:12px;padding:13px 20px;background:#a78bfa;color:#100c1c;font-weight:800;cursor:pointer}
main{max-width:1100px;margin:auto;padding:45px 22px}
.hero{padding:35px;border-radius:24px;background:linear-gradient(120deg,#292044,#171b30,#10302e);margin-bottom:35px}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.05;margin:0 0 12px}
.hero p{color:#c7c2d8}
h2{font-size:22px}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#151724;border:1px solid #292b3b;border-radius:17px;padding:18px;min-height:130px}
.card small{color:#aaa5bd}
.empty{text-align:center;padding:45px 15px;color:#aaa5bd}
#editor{display:none;margin-top:35px}
.preview{background:#000;border-radius:18px;min-height:240px;display:flex;align-items:center;justify-content:center;overflow:hidden}
video{max-width:100%;max-height:420px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.tool{background:#1c1d2b;color:#eee;border:1px solid #34344a}
.timeline{background:#171824;padding:18px;border-radius:15px;margin-top:15px}
.track{height:45px;background:#29213e;border:1px solid #8066c7;border-radius:9px;margin-top:12px;padding:12px;color:#cbbaff}
input[type=file]{display:none}
</style>
</head>
<body>
<header>
<div class="logo">AVI <span>STUDIO</span></div>
<div>FREE VIDEO EDITOR</div>
</header>

<main>
<section class="hero">
<h1>MAKE SOMETHING<br>WORTH WATCHING.</h1>
<p>Your creativity. Your footage. Your rules.</p>
<button onclick="document.getElementById('media').click()">＋ Create project</button>
<input id="media" type="file" accept="video/*,image/*,audio/*" multiple>
</section>

<h2>Your projects</h2>
<div class="projects" id="projects">
<div class="card empty" id="empty">🎬<br><br>No projects yet.<br>Import your first clip to begin.</div>
</div>

<section id="editor">
<h2>Editing workspace</h2>
<div class="preview" id="preview">Your preview will appear here</div>
<div class="tools">
<button class="tool" onclick="alert('Trim tools coming next!')">✂ Trim</button>
<button class="tool" onclick="alert('Split tools coming next!')">Split</button>
<button class="tool" onclick="alert('Text tools coming next!')">Text</button>
<button class="tool" onclick="alert('Audio tools coming next!')">Audio</button>
<button class="tool" onclick="alert('Effects coming next!')">Effects</button>
<button class="tool" onclick="alert('Export is coming next!')">Export</button>
</div>
<div class="timeline">
<strong>TIMELINE</strong>
<div class="track" id="track">Your media clip will appear here</div>
</div>
</section>
</main>

<script>
const picker=document.getElementById('media');
const projects=document.getElementById('projects');
const editor=document.getElementById('editor');
const preview=document.getElementById('preview');
const track=document.getElementById('track');
let currentUrl=null;

picker.addEventListener('change',()=>{
const files=Array.from(picker.files);
if(!files.length)return;
document.getElementById('empty')?.remove();

files.forEach(file=>{
const card=document.createElement('div');
card.className='card';
card.innerHTML='<strong></strong><br><small></small>';
card.querySelector('strong').textContent=file.name;
card.querySelector('small').textContent=(file.size/1048576).toFixed(1)+' MB';
card.onclick=()=>openEditor(file);
projects.prepend(card);
});
openEditor(files[0]);
});

function openEditor(file){
editor.style.display='block';
track.textContent=file.name;
if(currentUrl)URL.revokeObjectURL(currentUrl);
currentUrl=URL.createObjectURL(file);
if(file.type.startsWith('video/')){
const video=document.createElement('video');
video.src=currentUrl;
video.controls=true;
preview.replaceChildren(video);
}else if(file.type.startsWith('image/')){
const img=document.createElement('img');
img.src=currentUrl;
img.style.maxWidth='100%';
img.style.maxHeight='420px';
preview.replaceChildren(img);
}else{
preview.textContent='Audio imported: '+file.name;
}
editor.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
