
name: AVI STUDIO iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avi-studio-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build AVI STUDIO IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          echo "macOS version:"
          sw_vers
          echo "Xcode version:"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Verify project files
        run: |
          test -f project.yml
          test -d Sources
          echo "Project files found."

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d AVIStudio.xcodeproj
          echo "Xcode project generated."

      - name: Build iOS app
        run: |
          xcodebuild \
            -project AVIStudio.xcodeproj \
            -scheme AVIStudio \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify compiled app
        run: |
          test -d build/Build/Products/Release-iphoneos/AVIStudio.app
          echo "App successfully compiled."

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AVIStudio.app Payload/
          zip -r AVI-STUDIO-unsigned.ipa Payload

      - name: Verify IPA
        run: |
          test -f AVI-STUDIO-unsigned.ipa
          ls -lh AVI-STUDIO-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AVI-STUDIO-unsigned-IPA
          path: AVI-STUDIO-unsigned.ipa
          retention-days: 14
